[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "final-project"
version = "0.1.0"
description = "MLB Statcast highlight finder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pybaseball>=2.2.7",
]

[project.scripts]
mlb-highlights = "main:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.setuptools]
py-modules = ["main"]
